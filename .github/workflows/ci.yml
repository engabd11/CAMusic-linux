name: CI

on:
  push:
  pull_request:
    branches: [linux/compose-module]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The panel runs on JDK 21; the module follows the JDK it is built with.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :linux:test

      # Every pane drawn offscreen with a fake library (src/test/.../preview) — the
      # one way to look at the UI without the panel. Kept apart from the tests so a
      # rendering hiccup on the runner never hides a test result.
      - name: Render previews
        continue-on-error: true
        timeout-minutes: 30
        run: ./gradlew :linux:renderPreviews

      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previews
          path: linux/build/previews/*.png
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: linux/build/reports/tests/
          if-no-files-found: ignore
